services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: always
    dns:
      - 8.8.8.8
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - shared-voices:/voices
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  celery:
      build:
        context: .
        dockerfile: bot/Dockerfile
      command: ["celery", "-A", "bot.tasks", "worker", "--loglevel=INFO", "-P", "solo"]
      environment:
        BOT_TOKEN: ${BOT_TOKEN}
        GROQ_API_KEY: ${GROQ_API_KEY}
        LLAMA_API_KEY: ${LLAMA_API_KEY}
      volumes:
        - shared-voices:/voices
      depends_on:
        - redis
        - bot


volumes:
  shared-voices: